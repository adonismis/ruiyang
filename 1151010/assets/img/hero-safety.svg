<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" fill="none" aria-hidden="true">
  <defs>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1c8cf0" stop-opacity=".38"/>
      <stop offset="1" stop-color="#1c8cf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8f5"/>
      <stop offset=".55" stop-color="#1573d0"/>
      <stop offset="1" stop-color="#0a468f"/>
    </linearGradient>
  </defs>
  <style>
    .hex1{transform-origin:260px 226px;animation:spin 70s linear infinite}
    .hex2{transform-origin:260px 226px;animation:spin 110s linear infinite reverse}
    .check{stroke-dasharray:140;stroke-dashoffset:0;animation:draw 6s ease-in-out infinite}
    .float{animation:bob 6s ease-in-out infinite}
    .d2{animation-delay:-2s}
    .d3{animation-delay:-4s}
    .tw{animation:tw 3s ease-in-out infinite}
    .pulse{transform-origin:260px 226px;animation:pulse 4s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes draw{0%{stroke-dashoffset:140}22%,86%{stroke-dashoffset:0}100%{stroke-dashoffset:140}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.06);opacity:.15}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <circle cx="260" cy="226" r="228" fill="url(#glow)"/>

  <g class="hex2" stroke="#5fd3f3" stroke-opacity=".28" stroke-width="1.5">
    <polygon transform="translate(260 226)" points="0,-232 200.9,-116 200.9,116 0,232 -200.9,116 -200.9,-116" stroke-dasharray="3 9"/>
  </g>
  <g class="hex1">
    <polygon transform="translate(260 226)" points="0,-190 164.5,-95 164.5,95 0,190 -164.5,95 -164.5,-95" stroke="#5fd3f3" stroke-opacity=".5" stroke-width="1.8"/>
    <g transform="translate(260 226)" fill="#5fd3f3">
      <circle cy="-190" r="5"/><circle cx="164.5" cy="-95" r="5"/><circle cx="164.5" cy="95" r="5"/>
      <circle cy="190" r="5"/><circle cx="-164.5" cy="95" r="5"/><circle cx="-164.5" cy="-95" r="5"/>
    </g>
  </g>
  <circle class="pulse" cx="260" cy="226" r="150" stroke="#5fd3f3" stroke-width="2"/>

  <g transform="translate(260 226)">
    <path d="M0 -128L100 -92V8C100 74 58 120 0 146C-58 120 -100 74 -100 8V-92Z" fill="url(#shield)" stroke="#bfe9ff" stroke-opacity=".85" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0 -128L-100 -92V8C-100 74 -58 120 0 146Z" fill="#fff" fill-opacity=".1"/>
    <path d="M0 -106L80 -78V6C80 60 47 98 0 120C-47 98 -80 60 -80 6V-78Z" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-linejoin="round"/>
    <path class="check" d="M-40 8L-10 40L46 -28" stroke="#fff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g class="float">
    <rect x="410" y="64" width="72" height="72" rx="18" fill="#0a2d57" fill-opacity=".92" stroke="#5fd3f3" stroke-opacity=".55"/>
    <g transform="translate(446 100)" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-22 12C-22 -8 -10 -20 0 -20C10 -20 22 -8 22 12Z" fill="#ffc94d" fill-opacity=".28" stroke="#ffc94d" stroke-width="3"/>
      <path d="M-28 12H28V18H-28Z" fill="#ffc94d" fill-opacity=".5" stroke="#ffc94d" stroke-width="3"/>
      <path d="M0 -20V12" stroke="#ffc94d" stroke-width="3"/>
    </g>
  </g>
  <g class="float d2">
    <rect x="44" y="300" width="72" height="72" rx="18" fill="#0a2d57" fill-opacity=".92" stroke="#5fd3f3" stroke-opacity=".55"/>
    <g transform="translate(80 336)" stroke-linejoin="round" stroke-linecap="round">
      <rect x="-16" y="-20" width="32" height="42" rx="5" stroke="#bfe9ff" stroke-width="3"/>
      <rect x="-8" y="-26" width="16" height="10" rx="3" fill="#0a2d57" stroke="#bfe9ff" stroke-width="3"/>
      <path d="M-8 2L-2 8L9 -6" stroke="#5fd3f3" stroke-width="4"/>
    </g>
  </g>
  <g class="float d3">
    <rect x="420" y="332" width="72" height="72" rx="18" fill="#0a2d57" fill-opacity=".92" stroke="#5fd3f3" stroke-opacity=".55"/>
    <g transform="translate(456 368)" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-18 18C-18 -6 -2 -20 20 -20C20 2 6 18 -18 18Z" fill="#5fd3f3" fill-opacity=".28" stroke="#bfe9ff" stroke-width="3"/>
      <path d="M-18 18C-6 6 4 -2 14 -12" stroke="#bfe9ff" stroke-width="3"/>
    </g>
  </g>

  <circle class="tw" cx="96" cy="120" r="2.5" fill="#bfe9ff"/>
  <circle class="tw" cx="478" cy="226" r="2" fill="#bfe9ff" style="animation-delay:-1s"/>
  <circle class="tw" cx="150" cy="432" r="2.5" fill="#bfe9ff" style="animation-delay:-2s"/>
  <circle class="tw" cx="352" cy="30" r="2" fill="#bfe9ff" style="animation-delay:-1.5s"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b78b0"/>
      <stop offset=".6" stop-color="#0a4570"/>
      <stop offset="1" stop-color="#061a33"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5fd3f3" stop-opacity=".4"/>
      <stop offset="1" stop-color="#5fd3f3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#fff" stroke-opacity=".06"/>
    </pattern>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f6ff"/>
      <stop offset="1" stop-color="#7cc4f3"/>
    </linearGradient>
  </defs>
  <style>
    .fan{animation:spin 7s linear infinite}
    .flow{animation:flow 2s linear infinite}
    .tw{animation:tw 3s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes flow{to{stroke-dashoffset:-60}}
    @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="300" height="400" fill="url(#bg)"/>
  <rect width="300" height="400" fill="url(#grid)"/>
  <g transform="translate(150 100) scale(.85) translate(-150 -148)">
  <circle cx="150" cy="148" r="150" fill="url(#glow)"/>

  <g stroke="#bfe9ff" stroke-linecap="round" stroke-width="3" stroke-dasharray="14 16">
    <path class="flow" stroke-opacity=".55" d="M-20 70C50 40 90 96 150 70S250 36 320 70"/>
    <path class="flow" stroke-opacity=".4" d="M-20 232C50 202 90 258 150 232S250 198 320 232" style="animation-delay:-.7s"/>
    <path class="flow" stroke-opacity=".28" d="M-20 262C50 232 90 288 150 262S250 228 320 262" style="animation-delay:-1.3s"/>
  </g>

  <g transform="translate(150 148)">
    <circle r="92" fill="#0a3a63" fill-opacity=".55" stroke="#9ddcff" stroke-width="5"/>
    <circle r="80" stroke="#fff" stroke-opacity=".15"/>
    <g class="fan" fill="url(#blade)" stroke="#fff" stroke-opacity=".7" stroke-width="1.5" stroke-linejoin="round">
      <path d="M0 0C-6 -30 14 -64 46 -66C40 -40 24 -14 0 0Z"/>
      <path transform="rotate(72)" d="M0 0C-6 -30 14 -64 46 -66C40 -40 24 -14 0 0Z"/>
      <path transform="rotate(144)" d="M0 0C-6 -30 14 -64 46 -66C40 -40 24 -14 0 0Z"/>
      <path transform="rotate(216)" d="M0 0C-6 -30 14 -64 46 -66C40 -40 24 -14 0 0Z"/>
      <path transform="rotate(288)" d="M0 0C-6 -30 14 -64 46 -66C40 -40 24 -14 0 0Z"/>
    </g>
    <circle r="14" fill="#0a3a63" stroke="#fff" stroke-width="3"/>
    <circle r="4.5" fill="#5fd3f3"/>
  </g>
  <circle class="tw" cx="40" cy="40" r="2.5" fill="#d9f1ff"/>
  <circle class="tw" cx="264" cy="130" r="2" fill="#d9f1ff" style="animation-delay:-1s"/>
  <circle class="tw" cx="40" cy="190" r="2.5" fill="#d9f1ff" style="animation-delay:-2s"/>
  </g>
</svg>

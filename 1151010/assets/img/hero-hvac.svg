<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" fill="none" aria-hidden="true">
  <defs>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1c8cf0" stop-opacity=".38"/>
      <stop offset="1" stop-color="#1c8cf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="face" cx=".5" cy=".38" r=".75">
      <stop offset="0" stop-color="#14508d"/>
      <stop offset="1" stop-color="#06213f"/>
    </radialGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ddcff"/>
      <stop offset=".55" stop-color="#2f8fe6"/>
      <stop offset="1" stop-color="#0b4f9c"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5fd3f3"/>
      <stop offset="1" stop-color="#2f8fe6"/>
    </linearGradient>
    <linearGradient id="pipeH" gradientUnits="userSpaceOnUse" x1="0" y1="407" x2="0" y2="429">
      <stop offset="0" stop-color="#4f9de0"/>
      <stop offset=".45" stop-color="#1664b3"/>
      <stop offset="1" stop-color="#093563"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a3a70"/>
      <stop offset=".4" stop-color="#4f9de0"/>
      <stop offset="1" stop-color="#093563"/>
    </linearGradient>
    <linearGradient id="fadeX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".14" stop-color="#fff"/>
      <stop offset=".86" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fade"><rect width="520" height="460" fill="url(#fadeX)"/></mask>
  </defs>
  <style>
    .needle{transform:rotate(59deg);animation:sweep 9s ease-in-out infinite}
    .arc{stroke-dasharray:359.6 500;animation:grow 9s ease-in-out infinite}
    .flow{animation:flow 1.6s linear infinite}
    .float{animation:bob 6s ease-in-out infinite}
    .d2{animation-delay:-2s}
    .d3{animation-delay:-4s}
    .spin{animation:spin 6s linear infinite}
    .orbit{transform-origin:260px 222px;animation:spin 80s linear infinite}
    .tw{animation:tw 3s ease-in-out infinite}
    @keyframes sweep{0%{transform:rotate(-135deg)}14%{transform:rotate(68deg)}18%{transform:rotate(56deg)}22%{transform:rotate(62deg)}26%,86%{transform:rotate(59deg)}96%,100%{transform:rotate(-135deg)}}
    @keyframes grow{0%{stroke-dasharray:0 500}14%{stroke-dasharray:375.5 500}18%{stroke-dasharray:353.3 500}22%{stroke-dasharray:364.4 500}26%,86%{stroke-dasharray:359.6 500}96%,100%{stroke-dasharray:0 500}}
    @keyframes flow{to{stroke-dashoffset:-64}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <circle cx="260" cy="222" r="228" fill="url(#glow)"/>
  <circle class="orbit" cx="260" cy="222" r="206" stroke="#5fd3f3" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="2 10"/>
  <circle cx="260" cy="222" r="184" stroke="#fff" stroke-opacity=".08"/>

  <g mask="url(#fade)">
    <rect x="0" y="407" width="520" height="22" fill="url(#pipeH)"/>
    <rect x="0" y="407" width="520" height="2.5" fill="#bfe9ff" fill-opacity=".45"/>
    <path class="flow" d="M0 418H520" stroke="#cfeeff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10 22"/>
    <rect x="86" y="402" width="12" height="32" rx="3" fill="#0b3b73" stroke="#5fd3f3" stroke-opacity=".55"/>
    <rect x="422" y="402" width="12" height="32" rx="3" fill="#0b3b73" stroke="#5fd3f3" stroke-opacity=".55"/>
  </g>
  <rect x="248" y="368" width="24" height="42" fill="url(#stem)"/>
  <rect x="241" y="400" width="38" height="9" rx="3" fill="#0b3b73" stroke="#5fd3f3" stroke-opacity=".55"/>

  <g transform="translate(260 222)">
    <circle r="150" fill="url(#face)" stroke="url(#bezel)" stroke-width="7"/>
    <circle r="141" stroke="#9ddcff" stroke-opacity=".22"/>
    <path d="M-89.4 91.6A128 128 0 1 1 88.2 92.8" stroke="#9ddcff" stroke-opacity=".6" stroke-width="7" stroke-dasharray="2.5 14.255" stroke-dashoffset="-.25"/>
    <path d="M-89.4 91.6A128 128 0 1 1 88.2 92.8" stroke="#e6f6ff" stroke-width="13" stroke-dasharray="3 97.53"/>
    <path d="M-75 75A106 106 0 1 1 75 75" stroke="#fff" stroke-opacity=".09" stroke-width="12" stroke-linecap="round"/>
    <path class="arc" d="M-75 75A106 106 0 1 1 91.2 -54" stroke="url(#arc)" stroke-width="12" stroke-linecap="round"/>
    <g transform="translate(0 92) scale(.5)" stroke="#bfe9ff" stroke-width="5" stroke-linecap="round">
      <path d="M0 0L0 -40M0 -18L-7.8 -25.8M0 -18L7.8 -25.8M0 -28L-4.9 -32.9M0 -28L4.9 -32.9M0 0L34.6 -20M15.6 -9L18.4 -19.6M15.6 -9L26.2 -6.2M24.2 -14L26.1 -20.8M24.2 -14L31 -12.2M0 0L34.6 20M15.6 9L26.2 6.2M15.6 9L18.4 19.6M24.2 14L31 12.2M24.2 14L26.1 20.8M0 0L0 40M0 18L7.8 25.8M0 18L-7.8 25.8M0 28L4.9 32.9M0 28L-4.9 32.9M0 0L-34.6 20M-15.6 9L-18.4 19.6M-15.6 9L-26.2 6.2M-24.2 14L-26.1 20.8M-24.2 14L-31 12.2M0 0L-34.6 -20M-15.6 -9L-26.2 -6.2M-15.6 -9L-18.4 -19.6M-24.2 -14L-31 -12.2M-24.2 -14L-26.1 -20.8"/>
    </g>
    <g class="needle">
      <path d="M-4.5 20L-1.3 -92L0 -98L1.3 -92L4.5 20Z" fill="#fff"/>
      <circle r="13" fill="#0b2e5c" stroke="#fff" stroke-width="3.5"/>
      <circle r="4.5" fill="#5fd3f3"/>
    </g>
  </g>

  <g class="float">
    <rect x="52" y="86" width="72" height="72" rx="18" fill="#0a2d57" fill-opacity=".92" stroke="#5fd3f3" stroke-opacity=".55"/>
    <g transform="translate(88 122) scale(.62)" stroke="#bfe9ff" stroke-width="3.6" stroke-linecap="round">
      <path d="M0 0L0 -40M0 -18L-7.8 -25.8M0 -18L7.8 -25.8M0 -28L-4.9 -32.9M0 -28L4.9 -32.9M0 0L34.6 -20M15.6 -9L18.4 -19.6M15.6 -9L26.2 -6.2M24.2 -14L26.1 -20.8M24.2 -14L31 -12.2M0 0L34.6 20M15.6 9L26.2 6.2M15.6 9L18.4 19.6M24.2 14L31 12.2M24.2 14L26.1 20.8M0 0L0 40M0 18L7.8 25.8M0 18L-7.8 25.8M0 28L4.9 32.9M0 28L-4.9 32.9M0 0L-34.6 20M-15.6 9L-18.4 19.6M-15.6 9L-26.2 6.2M-24.2 14L-26.1 20.8M-24.2 14L-31 12.2M0 0L-34.6 -20M-15.6 -9L-26.2 -6.2M-15.6 -9L-18.4 -19.6M-24.2 -14L-31 -12.2M-24.2 -14L-26.1 -20.8"/>
    </g>
  </g>

  <g class="float d2">
    <rect x="402" y="140" width="72" height="72" rx="18" fill="#0a2d57" fill-opacity=".92" stroke="#5fd3f3" stroke-opacity=".55"/>
    <path transform="translate(438 176)" d="M4 -24L-14 3H-2L-6 24L14 -4H2Z" fill="#ffc94d"/>
  </g>

  <g class="float d3">
    <rect x="60" y="284" width="72" height="72" rx="18" fill="#0a2d57" fill-opacity=".92" stroke="#5fd3f3" stroke-opacity=".55"/>
    <g transform="translate(96 320)">
      <circle r="25" stroke="#bfe9ff" stroke-opacity=".55" stroke-width="2"/>
      <g class="spin" fill="#5fd3f3" fill-opacity=".3" stroke="#bfe9ff" stroke-width="2" stroke-linejoin="round">
        <path d="M0 0C-2 -12 6 -22 17 -17C14 -9 8 -3 0 0Z"/>
        <path transform="rotate(120)" d="M0 0C-2 -12 6 -22 17 -17C14 -9 8 -3 0 0Z"/>
        <path transform="rotate(240)" d="M0 0C-2 -12 6 -22 17 -17C14 -9 8 -3 0 0Z"/>
      </g>
      <circle r="4" fill="#bfe9ff"/>
    </g>
  </g>

  <circle class="tw" cx="160" cy="52" r="2.5" fill="#bfe9ff"/>
  <circle class="tw" cx="392" cy="66" r="2" fill="#bfe9ff" style="animation-delay:-1s"/>
  <circle class="tw" cx="470" cy="278" r="2.5" fill="#bfe9ff" style="animation-delay:-2s"/>
  <circle class="tw" cx="32" cy="224" r="2" fill="#bfe9ff" style="animation-delay:-1.5s"/>
  <circle class="tw" cx="444" cy="352" r="2" fill="#bfe9ff" style="animation-delay:-.5s"/>
</svg>
